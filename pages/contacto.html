<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome para fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- Font Awesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Nuestro css interno va como ultimo link -->
  <link rel="stylesheet" href="../css/styles.css">
  <title>Olivo Libreria</title>
</head>

<body>
  <header>
    <div class="contenedor-logo">
      <a href="../index.html" class="logo">
        <i class="fa-solid fa-seedling"></i>
        <span>Olivo Librería</span>
      </a>
    </div>
    <nav class="header-nav">
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../index.html#productos">Productos</a></li>
        <li><a href="#">Contacto</a></li>
        <li><a href="../index.html#reseñas">Reseñas</a></li>
        <li><a href="./carrito.html">Carrito</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="contenedor-form">
      <h2 class="tx-titulo titulo-contacto">Contactanos</h2>
      <form class="form-contacto" action="https://formspree.io/f/mbgdoqnb" method="POST">
        <div class="grupo-input">

          <label for="name">
            Nombre:
          </label>
          <input type="text" name="name" id="name">
        </div>
        <div class="grupo-input">
          <label for="email">
            E-mail:
          </label>
          <input type="email" name="email" id="email">
        </div>
        <div class="grupo-input">
          <label for="message">
            Mensaje:
          </label>
          <textarea name="message" id="message"></textarea>
        </div>

        <button class="btn btn-enviar" type="submit">Enviar</button>
      </form>

    </section>
  </main>
  <footer>
    <div class="contenedor-logo">
      <a href="#" class="logo">
        <i class="fa-solid fa-seedling"></i>
        <span>Olivo Librería</span>
      </a>
    </div>
    <nav class="footer-nav">
      <ul>
        <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
        <li><a href="#"><i class="fa-brands fa-whatsapp"></i></a></li>
      </ul>
    </nav>
  </footer>
</body>

</html>
